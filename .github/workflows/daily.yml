name: Daily Stock Prediction

on:
  schedule:
    # 9:30pm UTC Mon-Fri = after US markets close (4pm EST), after India markets close (3:30pm IST)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run predictor
        run: python predictor.py

      - name: Run paper trader
        run: python trader.py

      - name: Commit updated history and trades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json trades.json
          git diff --staged --quiet || git commit -m "Daily prediction & trades — $(date -u +%Y-%m-%d)"
          git push
